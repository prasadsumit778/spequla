contract:
  version: 1
  label: Net revenue
  category: CONVENTION
  definition: 'Revenue after all declared customer-facing deductions. This is the denominator for every
    margin ratio in the system, which is why the deduction list is declared once per company and frozen
    rather than assumed.

    '
  formula: metric.gross_revenue - sum(declared_deductions)
  declared_deductions:
  - id: sales_returns
    included: true
    source_class: contra_revenue.sales_returns
    governed_by: D-003
  - id: trade_discount
    included: true
    source_class: contra_revenue.trade_discount
    governed_by: D-003
  - id: cash_discount
    included: true
    source_class: contra_revenue.cash_discount
    governed_by: D-003
  - id: rate_difference
    included: true
    source_class: contra_revenue.rate_difference
    governed_by: D-003
  - id: scheme_rebate
    included: false
    source_class: contra_revenue.scheme_rebate
    governed_by: D-003
  - id: marketplace_commission
    included: false
    source_class: contra_revenue.commission_marketplace
    governed_by: D-004
    applies_to_profile: consumer
  - id: shipping_recovered
    included: false
    source_class: contra_revenue.shipping_recovered
    governed_by: D-005
    applies_to_profile: consumer
  source_facts:
  - fact_invoice_line
  - fact_gl_entry
  dimensions:
  - entity
  - date
  - customer
  - product
  - channel
  - location
  aggregation: sum
  time_logic: period_sum
  currency: base
  requires:
  - check: period_has_approved_mapping
    on_fail: Metrics are unavailable for this period until the account mapping is approved.
  - check: unmapped_value_below_threshold
    threshold_governed_by: D-053
    on_fail: Serve with a badge stating the unmapped rupee value, or block. Per D-053.
  - check: gst_treatment_declared
    governed_by: D-001
    on_fail: BLOCKING. Without knowing whether sales ledgers are GST-inclusive, this metric is wrong by
      the GST rate and nothing downstream detects it.
  override_scope: company
  governed_by:
  - D-001
  - D-002
  - D-003
  - D-004
  - D-005
  - D-006
  - D-007
  - D-008
  - D-009
  - D-010
  approved_by: pending
  owner: SPEQULA global default
