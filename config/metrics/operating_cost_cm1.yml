contract:
  version: 1
  label: Operating cost (to CM1)
  category: MANAGEMENT
  profile: consumer
  definition: 'Costs deducted from gross margin to reach CM1. Marketing is excluded by design, because
    the whole purpose of the CM1 rung is to isolate economics before marketing.

    '
  formula: sum(declared_cm1_costs)
  declared_cm1_costs:
  - id: servicing_cost
    included: true
  - id: fulfilment
    included: true
    note: 'D-020 was resolved against its own suggested default here. The suggestion put fulfilment in
      COGS. It sits above CM1 instead, because putting it in COGS would double-count it and empty this
      rung of meaning. Manufacturing, which has no ladder, keeps warehousing in COGS.

      '
  - id: offline_manpower
    included: true
  - id: offline_rent_and_operational
    included: true
  - id: marketing
    included: false
  governed_by:
  - D-060
  - D-020
  approved_by: human
