contract:
  version: 1
  label: Days sales outstanding
  category: CONVENTION
  definition: How long customers take to pay, expressed in days.
  formula: metric.accounts_receivable / metric.[revenue_base] * days_basis
  parameters:
    ar_basis:
      options:
      - period_end
      - average_of_opening_and_closing
      default: period_end
      governed_by: D-028
      note: 'Average smooths seasonal receivable spikes and is technically better. Period-end is what
        most Indian promoters compute mentally. Match the promoter, not the textbook.

        '
    revenue_base:
      options:
      - gross_revenue
      - net_revenue
      default: net_revenue
      governed_by: D-028
    days_basis:
      options:
      - 365
      - 360
      default: 365
      governed_by: D-028
    include_unbilled:
      options:
      - true
      - false
      default: false
      governed_by: D-029
    include_marketplace_settlement:
      options:
      - true
      - false
      default: false
      governed_by: D-033
      applies_to_profile: consumer
      note: 'Marketplace settlement receivable ages on a platform payout cycle, not on customer credit
        terms. Mixing it into trade AR makes DSO meaningless for a consumer brand.

        '
    net_bill_discounting:
      options:
      - true
      - false
      default: false
      governed_by: D-036
      note: 'Setting this true reduces AR by discounted bills, which improves DSO and hides leverage at
        the same time. The default is false because the honest presentation keeps the receivable and shows
        the borrowing.

        '
  aggregation: ratio_of_sums
  time_logic: period_end
  unit: days
  source_facts:
  - derived
  dependencies:
  - accounts_receivable
  - net_revenue
  dimensions:
  - entity
  - date
  override_scope: company
  governed_by:
  - D-028
  - D-029
  - D-033
  - D-036
  approved_by: pending
