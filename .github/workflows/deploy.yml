name: Deploy

# Runs only after CI has actually passed on this exact commit on main --
# never on a push directly, so a broken build can never reach the registry
# or a live database. See .github/workflows/ci.yml.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: sha
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Backend: no build args, identical image regardless of which tenant
      # or environment it's pointed at (see Dockerfile's own note).
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.sha.outputs.sha }}
            ${{ env.API_IMAGE }}:latest

      # Frontend: NEXT_PUBLIC_* values bake in at build time (Next.js's own
      # rule, see web/Dockerfile) -- set these as repo Variables (not
      # secrets; they end up in the client bundle regardless) once the
      # production API URL and WorkOS redirect URI are known.
      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WORKOS_REDIRECT_URI=${{ vars.NEXT_PUBLIC_WORKOS_REDIRECT_URI }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.sha.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Forward-only, idempotent (db/migrations/runner.py tracks what's
      # already applied in app.schema_migration) -- safe to run every
      # deploy. Runs as its OWN step, before any new app instance starts,
      # never as part of the API container's entrypoint: multiple instances
      # starting at once must never race to apply the same migration.
      - name: Apply migrations to every registered tenant
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 db/migrations/runner.py

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Check whether a deploy target is configured yet
        id: check
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "No deploy target configured yet (FLY_API_TOKEN unset) -- images were built, tagged"
            echo "${{ needs.build-and-push.outputs.sha }} and pushed to $API_IMAGE / $WEB_IMAGE,"
            echo "and migrations ran. Nothing further to do until a hosting platform is chosen."
            echo "See docs/deployment.md for how to wire this step to Fly.io, Cloud Run or Render."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Worked example: Fly.io, chosen in docs/deployment.md's comparison
      # for having a Mumbai region, being container-native, and needing no
      # Kubernetes (corpus/12 section 1 rejects Kubernetes explicitly).
      # Swap this step for Cloud Run / Render / Railway's equivalent
      # without touching build-and-push or migrate above -- see
      # docs/deployment.md for the swap-in versions of this step.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'true'
      - name: Deploy API to Fly.io
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --config fly.api.toml --image ${{ env.API_IMAGE }}:${{ needs.build-and-push.outputs.sha }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy web to Fly.io
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --config fly.web.toml --image ${{ env.WEB_IMAGE }}:${{ needs.build-and-push.outputs.sha }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
