name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spequla
          POSTGRES_PASSWORD: spequla
          POSTGRES_DB: spequla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spequla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spequla:spequla@localhost:5432/spequla
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: spequla
      OBJECT_STORE_SECRET_KEY: spequla_dev_only
      OBJECT_STORE_BUCKET: spequla-raw
    steps:
      - uses: actions/checkout@v4

      # corpus/04 section 2's immutable raw landing. Every ingestion path
      # writes the raw file to object storage before staging, so the whole
      # integration suite needs it. Same image, credentials and bucket as
      # docker-compose.yml uses locally; src/ingest/landing.py creates the
      # bucket on first use. Started as a plain container rather than a
      # service because service containers cannot override an image's
      # command, and minio/minio needs `server /data`. Readiness mirrors
      # docker-compose's healthcheck for this service: 20 tries, 2s apart.
      - name: Start object store
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=spequla \
            -e MINIO_ROOT_PASSWORD=spequla_dev_only \
            minio/minio server /data
          for _ in $(seq 20); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "object store did not become ready" >&2
          docker logs minio >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # corpus/11 section 5: "Every commit -- SQL compilation, IR parsing,
      # unit tests." The compiler and IR validator arrive in a later sprint;
      # for sprint 0/1 this is config + migration + ingestion unit and
      # integration tests.
      - name: Unit tests
        run: PYTHONPATH=. pytest tests/unit -q

      # Migration dry run: shared migrations plus one throwaway tenant schema,
      # applied against a clean database, per corpus/12 sprint 0's "CI running"
      # exit item and corpus/04 section 6's "loop over schemas in one deploy."
      - name: Migration dry run
        run: |
          PYTHONPATH=. python3 db/migrations/runner.py
          PYTHONPATH=. python3 scripts/create_tenant.py ci-dry-run --synthetic
          PYTHONPATH=. python3 db/migrations/runner.py

      - name: Integration tests
        run: PYTHONPATH=. pytest tests/integration -q

      # corpus/11 section 3.1: financial accuracy is GATING, "exact, to the
      # rupee, no tolerance." tests/eval/test_trial_balance_36_months.py is
      # sprint 1's acceptance criterion; the golden-question suite (corpus/10)
      # lands in sprint 4.
      - name: Eval suite (gating)
        run: PYTHONPATH=. pytest tests/eval -q
