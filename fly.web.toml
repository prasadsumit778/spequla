# Example Fly.io config for the frontend -- see fly.api.toml's header for
# how this is used and how to swap it for a different platform.

app = "CHANGE-ME-spequla-web"
primary_region = "bom"   # Mumbai

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"
