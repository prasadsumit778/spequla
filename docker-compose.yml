services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spequla
      POSTGRES_PASSWORD: spequla
      POSTGRES_DB: spequla
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spequla"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spequla
      MINIO_ROOT_PASSWORD: spequla_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
